name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-mcp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project dependencies with uv
        run: uv sync --python python
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests
      - name: Run full unit, negative and MCP client suite
        run: uv run python -m unittest discover -s tests -v

  real-verilator-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Bootstrap uv and real Verilator
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y verilator
          verilator --version
          uv sync --python python
      - name: Real passing and failing SystemVerilog lint through MCP
        env:
          VERILATOR_MCP_RUN_INTEGRATION: '1'
        run: uv run python -m unittest discover -s tests -p 'test_lint_integration.py' -v

  real-verilator-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install uv, C++ toolchain and Verilator
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y verilator make g++
          verilator --version
          make --version
          c++ --version
          uv sync --python python
      - name: Compile passing/failing public SV testbenches through MCP
        env:
          VERILATOR_MCP_RUN_INTEGRATION: '1'
        run: uv run python -m unittest discover -s tests -p 'test_build_integration.py' -v

  real-verilator-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Verilator and C++ toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y verilator make g++
          verilator --version
          uv sync --python python
      - name: Real passing, fatal, inconclusive and watchdog simulation
        env:
          VERILATOR_MCP_RUN_INTEGRATION: '1'
        shell: bash
        run: |
          ulimit -c 0
          uv run python -m unittest discover -s tests -p 'test_simulation_integration.py' -v
      - name: Real seeded multi-case regression through MCP
        env:
          VERILATOR_MCP_RUN_INTEGRATION: '1'
        shell: bash
        run: |
          ulimit -c 0
          uv run python -m unittest discover -s tests -p 'test_regression_integration.py' -v

  real-verilator-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Verilator coverage and C++ toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y verilator make g++
          verilator --version
          verilator_coverage --version
          uv sync --python python
      - name: Real instrumented SV and parsed LCOV through MCP
        env:
          VERILATOR_MCP_RUN_INTEGRATION: '1'
        run: uv run python -m unittest discover -s tests -p 'test_coverage_integration.py' -v
