name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-mcp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project dependencies with uv
        run: uv sync --python python
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests
      - name: Run complete unit and real MCP protocol tests
        run: uv run python -m unittest discover -s tests -v
