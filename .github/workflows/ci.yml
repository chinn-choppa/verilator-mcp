name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install managed Python
        shell: bash
        run: uv python install "${{ matrix.python-version }}"
      - name: Verify committed uv.lock is current
        shell: bash
        run: uv lock --check
      - name: Install pinned project and pytest
        shell: bash
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Compile source and tests
        shell: bash
        run: uv run --locked python -m compileall -q src tests
      - name: Run native pytest suite with real MCP SDK
        shell: bash
        run: uv run --locked pytest -q tests
